<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" role="img" aria-label="entangle">
  <!--
    Two strands, woven through each other twice. One goes over on the left and
    under on the right, so neither is the main one - which is the whole claim the
    name makes.

    The one thing to not undo: the gaps. Without them this is two arcs touching,
    and two arcs touching in a single colour is a blob. The over-and-under is
    carried entirely by those two holes, so they are computed rather than
    eyeballed: the strands cross at x=12.33 and x=51.67 on the centre line, and
    each hole is centred exactly there. Nudging a strand without recomputing the
    holes puts the clearance off-centre, which does not read as a mistake at 64px
    but shows up as a smudge at 16.

    Sized so the ink fills the frame. The obvious version of this drawing sits in
    the middle of the box with a wide margin, which throws away about a third of
    the pixels you get in a favicon.

    Everything is currentColor. Set it to coral (#ff5a36) on the site, let it
    inherit in a README, make it solid black for a sticker - no second file.

    Symmetric about y=32 and about x=32, so it sits centred in a rounded-square
    app icon without nudging. Use logo-mark.svg below roughly 32px: same drawing,
    thicker stroke, because the gaps are the first thing to disappear.
  -->
  <defs>
    <mask id="weave-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <!-- clearance at each crossing, so the strand underneath breaks cleanly -->
      <circle cx="12.33" cy="32" r="5.7" fill="#000"/>
      <circle cx="51.67" cy="32" r="5.7" fill="#000"/>
    </mask>
  </defs>
  <g stroke="currentColor" stroke-width="7" stroke-linecap="round">
    <!-- the strand that passes over -->
    <path d="M5 56C5 11 59 11 59 56"/>
    <!-- and the one that passes under, broken at both crossings -->
    <path d="M5 8C5 53 59 53 59 8" mask="url(#weave-gap)"/>
  </g>
</svg>
