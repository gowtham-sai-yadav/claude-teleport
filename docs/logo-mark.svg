<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" role="img" aria-label="entangle">
  <!--
    The small-size variant: same two woven strands, heavier stroke.

    Not a lazier logo.svg - a different drawing for a different constraint. The
    over-and-under in this mark is carried by two gaps, and a gap is the first
    thing a small render loses: at 16px one SVG unit is a quarter of a device
    pixel, so a clearance that looks generous at 64 antialiases into a grey
    thickening and the strands read as touching. Thickening the stroke and
    widening the holes to match keeps the break visible, at the cost of the
    lighter look logo.svg gets to have.

    The crossings moved when the stroke did, so the holes moved with them: they
    sit at x=13.89 and x=50.11, computed, not carried over from the other file.
    That is the one thing to check if you ever edit either drawing.

    Use this for the favicon, the macOS menu bar, a Windows tray icon, and the
    VS Code activity bar. Use logo.svg above roughly 32px.
  -->
  <defs>
    <mask id="mark-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="13.89" cy="32" r="7.7" fill="#000"/>
      <circle cx="50.11" cy="32" r="7.7" fill="#000"/>
    </mask>
  </defs>
  <g stroke="currentColor" stroke-width="9.5" stroke-linecap="round">
    <path d="M7 54C7 13 57 13 57 54"/>
    <path d="M7 10C7 51 57 51 57 10" mask="url(#mark-gap)"/>
  </g>
</svg>
